name: Deploy Notebooks to Databricks

on:
  push:
    branches:
      - dev # Adjust branch as needed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Databricks CLI
        run: |
            curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Verify Databricks CLI Installation
        run: |
          which databricks || echo "Databricks CLI not found!"
          databricks --version || echo "Databricks CLI not working!"

      - name: Delete Existing Notebooks from Databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
        run: |
            TARGET_DIR="/Workspace/Deployed/"  # Adjust Databricks folder path
            
            # Check if the directory exists before deleting
            if databricks workspace ls "$TARGET_DIR"; then
                echo "Deleting existing notebooks in $TARGET_DIR"
                databricks workspace delete "$TARGET_DIR" --recursive 
            else
                echo "Target directory does not exist, skipping deletion."
            fi

      - name: Recreate Target Directory
        env:
            DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
            DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
        run: |
            TARGET_DIR="/Workspace/Deployed/"
            echo "Recreating target directory: $TARGET_DIR"
            databricks workspace mkdirs "$TARGET_DIR"

      - name: Copy Notebooks to Databricks Workspace
        env:
            DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
            DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
        run: |
          NOTEBOOKS_DIR="./"  # Adjust the folder path in your repo
          TARGET_DIR="/Workspace/Deployed"

          for file in $NOTEBOOKS_DIR/*.py; do
              filename=$(basename -- "$file")
              echo "Uploading $filename to $TARGET_DIR"
              databricks workspace import "$file" "$TARGET_DIR/$filename" --format SOURCE --overwrite
          done

      - name: Cleanup Authentication
        run: rm -f ~/.databrickscfg
